<style>
:root{
  --bg:#f6efe2; --ink:#3b2a22; --accent:#c8372d; --wood:#b97a46; --wood2:#8f5a2f;
  --paper:#fffaf0; --bubble:#ffffff; --line:#e3d3b8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#1f1a18;--ink:#f3e8d8;--paper:#2c2420;--bubble:#3a2f2a;--line:#5a4a40;--wood:#a96d3c;--wood2:#7a4a24}
}
:root[data-theme="dark"]{--bg:#1f1a18;--ink:#f3e8d8;--paper:#2c2420;--bubble:#3a2f2a;--line:#5a4a40;--wood:#a96d3c;--wood2:#7a4a24}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-weight:500;
  display:flex;flex-direction:column;align-items:center;padding:20px 16px 28px;-webkit-tap-highlight-color:transparent}
h1{font-family:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;font-weight:800;font-size:1.5rem;letter-spacing:.12em;margin:4px 0 0}
.sub{font-size:.9rem;opacity:.75;margin:6px 0 0}
.stage{position:relative;width:min(100%,360px);height:300px;margin-top:10px;display:flex;align-items:center;justify-content:center}
#box{background:none;border:0;padding:0;cursor:pointer;width:200px;border-radius:16px}
#box:focus-visible,#again:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
#box svg{width:100%;height:auto;display:block;transform-origin:50% 90%}
#box.shake svg{animation:shake .9s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(0)}15%{transform:rotate(-14deg) translateY(-6px)}30%{transform:rotate(12deg)}45%{transform:rotate(-12deg) translateY(-6px)}60%{transform:rotate(10deg)}80%{transform:rotate(-5deg)}}
#stick{position:absolute;left:50%;top:6px;width:26px;height:150px;margin-left:-13px;background:linear-gradient(90deg,#e8c48a,#d1a265);border-radius:4px 4px 2px 2px;
  display:flex;align-items:center;justify-content:center;font-family:"Shippori Mincho",serif;font-weight:800;color:var(--accent);font-size:.8rem;writing-mode:vertical-rl;
  transform:translateY(60px);opacity:0;transition:transform .5s cubic-bezier(.2,1.4,.4,1),opacity .2s;pointer-events:none}
#stick.out{transform:translateY(-4px);opacity:1}
#result{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:14px;text-align:center;padding:16px}
#result.show{display:flex;animation:unfold .6s cubic-bezier(.2,1,.3,1)}
@keyframes unfold{from{transform:scaleY(.05);opacity:0}to{transform:scaleY(1);opacity:1}}
.no{font-size:.85rem;opacity:.7}
.rank{font-family:"Shippori Mincho","Hiragino Mincho ProN",serif;font-weight:800;font-size:5rem;line-height:1;color:var(--accent);letter-spacing:.05em}
.rank.s{font-size:4.2rem}
.items{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem;text-align:left;margin:4px 0 0}
.items b{color:var(--accent);font-weight:700}
.cat{display:flex;align-items:flex-end;gap:6px;width:min(100%,420px);margin-top:14px}
.cat svg{width:120px;flex:none;height:auto}
.bubble{position:relative;flex:1;background:var(--bubble);border:2px solid var(--ink);border-radius:20px;padding:14px 16px;min-height:76px;font-size:1.02rem;line-height:1.7;margin-bottom:34px}
.bubble::before{content:"";position:absolute;left:-12px;bottom:18px;width:20px;height:20px;background:var(--bubble);border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg) skew(10deg,10deg)}
#again{margin-top:6px;font:inherit;font-weight:700;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:12px 28px;cursor:pointer;visibility:hidden}
#again.show{visibility:visible}
.eye-h{display:none}
.happy .eye{display:none}.happy .eye-h{display:inline}
.eye{animation:blink 5s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.tail{transform-origin:20px 110px;animation:tail 2.4s ease-in-out infinite}
@keyframes tail{50%{transform:rotate(14deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <div class="bubble" id="say">今日も勉強おつかれさまにゃ。箱をタップして、今日の勉強運をひくにゃ！</div>
</div>
<button id="again">もう一度ひく</button>

<script>
const F=[
 {r:"大吉",w:1,m:["今日は集中力MAXの日にゃ！いちばん苦手な単元に挑戦するチャンスにゃ。","やる気のスイッチ、もう入ってるにゃ。机に向かえば、ぐんぐん進むにゃ！","きみの努力、ちゃんと実ってきてるにゃ。この調子で、今日は問題集を1章すすめるにゃ。"],i:["おすすめ：苦手科目に挑戦","集中力：バツグン","ひとこと：今日がチャンス"]},
 {r:"中吉",w:2,m:["いい流れにゃ。まずは15分、机に向かってみるにゃ。始めたら続くにゃ。","毎日の積み重ねが、本番のきみを支えるにゃ。今日も1ページ進めるにゃ。","今日のうちに、間違えた問題を解き直しておくと、あとで助かるにゃ。"],i:["おすすめ：間違い直し","集中力：まずまず","ひとこと：積み重ねが力"]},
 {r:"小吉",w:3,m:["スマホをカバンの奥にしまって、まず10分だけ勉強してみるにゃ。","今日は英単語20個にゃ。小さな一歩が、いつか大きな差になるにゃ。","ノートを見返してみるにゃ。忘れかけてたことが、思い出せるはずにゃ。"],i:["おすすめ：英単語・暗記","集中力：スマホ要注意","ひとこと：10分から始めよう"]},
 {r:"吉",w:4,m:["基本問題をていねいに解く日にゃ。基礎が固まれば、応用はこわくないにゃ。","今日は教科書をひらいて、今日の授業の復習をするにゃ。その日のうちが効くにゃ。","休憩もうまく使うにゃ。50分やって10分休む、これがおすすめにゃ。"],i:["おすすめ：授業の復習","集中力：ふつう","ひとこと：基礎を大切に"]},
 {r:"末吉",w:5,m:["今は結果が出なくても、あとから伸びるタイプにゃ。あきらめずに続けるにゃ。","ちょっと疲れてないにゃ？今日は早めに寝て、明日の朝にがんばるのもアリにゃ。","できなかった問題は、伸びしろにゃ。今日はそこをもう1回見直すにゃ。"],i:["おすすめ：解き直し","集中力：夜は早く寝て","ひとこと：伸びしろだらけ"]},
 {r:"凶",w:6,m:["悪い運は今ここで全部おしまいにゃ。あとは上がるだけにゃ！まず机に座ってみるにゃ。","今日はムリせず、短時間で切り上げるにゃ。続けることのほうが、大事にゃ。","うまくいかない日もあるにゃ。でも、ここで少しでも勉強できたら、きみの勝ちにゃ！"],i:["おすすめ：短時間でOK","集中力：ゆっくり","ひとこと：明日はきっといい日"]}
];
const $=id=>document.getElementById(id);
const box=$("box"),stick=$("stick"),res=$("result"),say=$("say"),cat=$("cat"),again=$("again"),hint=$("hint");
let busy=false,typer;
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

function pick(){
  const t=F.reduce((a,f)=>a+f.w,0);let x=Math.random()*t;
  for(const f of F){x-=f.w;if(x<0)return f}return F[0];
}
function speak(text){
  clearInterval(typer);
  if(reduce){say.textContent=text;return}
  say.textContent="";let n=0;
  typer=setInterval(()=>{say.textContent=text.slice(0,++n);if(n>=text.length)clearInterval(typer)},45);
}
function draw(){
  if(busy)return;busy=true;
  box.disabled=true;hint.textContent="ふりふり…";
  speak("ふりふりふり…にゃ…！");
  box.classList.add("shake");
  const num=Math.floor(Math.random()*99)+1;
  stick.textContent="第"+num+"番";
  setTimeout(()=>stick.classList.add("out"),700);
  setTimeout(()=>{
    const f=pick();
    $("no").textContent="第"+num+"番";
    const rk=$("rank");rk.textContent=f.r;rk.className="rank"+(f.r.length>1?" s":"");
    $("items").innerHTML=f.i.map(s=>{const[a,b]=s.split("：");return`<b>${a}</b><span>${b}</span>`}).join("");
    box.style.display="none";stick.style.display="none";
    res.classList.add("show");cat.classList.add("happy");
    hint.textContent="今日の勉強運にゃ";
    speak(f.m[Math.floor(Math.random()*f.m.length)]);
    again.classList.add("show");
  },1500);
}
function reset(){
  res.classList.remove("show");cat.classList.remove("happy");
  box.classList.remove("shake");stick.classList.remove("out");
  box.style.display="";stick.style.display="";box.disabled=false;busy=false;
  again.classList.remove("show");hint.textContent="箱をタップして、今日の勉強運をひいてみよう";
  speak("もう一回ひくにゃ？箱をタップにゃ！");
}
box.addEventListener("click",draw);
again.addEventListener("click",reset);
</script>
</body>
</html>
